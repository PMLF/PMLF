<svg xmlns="http://www.w3.org/2000/svg" width="410" height="200" viewBox="0 0 410 200" role="img" aria-label="pedrofonseca.dev: My bilingual portfolio: code, illustration, teaching and writing on one page.">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.5px; }
  .up { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade 1.2s ease both; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="410" height="200" rx="16" fill="#fbfaf7"/>
<rect x=".5" y=".5" width="409" height="199" rx="15.5" fill="none" stroke="rgba(10,10,10,0.08)"/>
<defs><clipPath id="f"><rect width="410" height="200" rx="16"/></clipPath></defs>
<rect width="4" height="200" fill="#d97706" clip-path="url(#f)"/>
<text x="28" y="38" class="mono" font-size="10.5" fill="#525252">FIXTURE 02</text>
<g class="up">
  <text x="26" y="76" class="sans" font-size="25" font-weight="900" letter-spacing="-.8" fill="#0a0a0a">pedrofonseca.dev</text>
  <text x="28" y="102" class="sans" font-size="13.5" fill="#525252">My bilingual portfolio: code, illustration,</text>
  <text x="28" y="121" class="sans" font-size="13.5" fill="#525252">teaching and writing on one page.</text>
</g>
<line x1="28" y1="150" x2="386" y2="150" stroke="rgba(10,10,10,0.10)"/>
<text x="28" y="177" class="mono" font-size="9.5" letter-spacing="1.2" fill="#a3a3a3">NEXT 16 · REACT 19 · TAILWIND 4</text>
</svg>